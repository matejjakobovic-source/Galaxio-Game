name: Godot Check

on:
  push:
    branches: [ main, "fix/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Import project and validate scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|ERROR:" godot-import.log; then
            echo "Godot reported import or script errors."
            exit 1
          fi

      - name: Smoke-run main scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee godot-smoke.log
          if grep -E "SCRIPT ERROR|ERROR:" godot-smoke.log; then
            echo "Godot reported runtime errors."
            exit 1
          fi

      - name: Exercise gameplay modes
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/runtime_smoke.gd 2>&1 | tee godot-gameplay.log
          if grep -E "SCRIPT ERROR|ERROR:|TEST_FAILURE" godot-gameplay.log; then
            echo "Gameplay runtime test failed."
            exit 1
          fi
          grep -q "RUNTIME_SMOKE_OK" godot-gameplay.log
