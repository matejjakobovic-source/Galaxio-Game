name: Godot Check

on:
  push:
    branches: [ main, "fix/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Import project and validate scripts
        run: godot --headless --path . --editor --quit

      - name: Smoke-run main scene
        run: godot --headless --path . --quit-after 5
